[package]
name = "sosang-app"
version = "0.1.0"
description = "sosang desktop app: the sosang UI plus direct LUT registration on LUMIX cameras over USB."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "sosang_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
lumix-lut = { path = "../crates/lumix-lut" }
lumix-ptp = { path = "../crates/lumix-ptp" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
